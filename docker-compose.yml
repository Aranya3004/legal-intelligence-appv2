# Not run in the authoring sandbox (no Docker there) — the same code was tested against real PostgreSQL via pgserver.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: legal, POSTGRES_PASSWORD: change-me, POSTGRES_DB: legal }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U legal"], interval: 5s, retries: 10 }
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://legal:change-me@db:5432/legal
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:3000
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {}, uploads: {} }
